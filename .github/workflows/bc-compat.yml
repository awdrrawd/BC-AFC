name: BC compatibility
# 每週檢查 AFC 所 hook 的 Bondage Club 函式，在目前的 BC 原始碼中是否仍然存在。
# 需要先設定儲存庫變數 BC_REPO_URL（見 docs/GitHub-Automation.md）。
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: BC 的分支或標籤（留空 = 預設分支或 BC_REF 變數）
        required: false
permissions:
  contents: read
  issues: write
jobs:
  hooks-exist:
    name: Hooked functions exist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Fetch Bondage Club sources
        shell: bash
        env:
          BC_REPO_URL: ${{ vars.BC_REPO_URL }}
          BC_REF: ${{ inputs.ref || vars.BC_REF }}
        run: |
          if [ -z "$BC_REPO_URL" ]; then
            echo "::error::請設定儲存庫變數 BC_REPO_URL（Settings → Secrets and variables → Actions → Variables）"
            exit 1
          fi
          branch=""
          if [ -n "$BC_REF" ]; then branch="--branch $BC_REF"; fi
          # 優先部分複製（只下載 Scripts/Screens）；上游不支援時退回一般淺層複製
          git clone --depth 1 $branch --filter=blob:none --sparse "$BC_REPO_URL" /tmp/bc \
            || { rm -rf /tmp/bc; git clone --depth 1 $branch "$BC_REPO_URL" /tmp/bc; }
          git -C /tmp/bc sparse-checkout set Scripts Screens
          echo "BC revision: $(git -C /tmp/bc describe --tags --always)"
      - name: Check hook targets
        id: check
        shell: bash
        run: node scripts/check-bc-compat.mjs /tmp/bc 2>&1 | tee /tmp/bc-compat.log
      - name: Open or update an issue
        if: failure() && steps.check.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create bc-compat --color D93F0B --description "BC 更新造成 AFC hook 失效" 2>/dev/null || true
          body="$(printf 'BC 版本：%s\n\n```\n%s\n```\n\n工作流程：%s\n' "$(git -C /tmp/bc describe --tags --always)" "$(cat /tmp/bc-compat.log)" "$RUN_URL")"
          existing="$(gh issue list --label bc-compat --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label bc-compat --title "BC 更新後部分 AFC hook 目標消失" --body "$body"
          fi
