name: BC compatibility
# 每週檢查 AFC 所 hook 的 Bondage Club 函式，在目前的 BC 原始碼中是否仍然存在。
# 有缺失時開 issue，缺失清單改變時更新並留言，全部恢復後自動關閉。
# 需要先設定儲存庫變數 BC_REPO_URL（見 docs/GitHub-Automation.md）。
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: BC 的分支或標籤（留空 = 預設分支或 BC_REF 變數）
        required: false
permissions:
  contents: read
  issues: write
jobs:
  hooks-exist:
    name: Hooked functions exist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Fetch Bondage Club sources
        shell: bash
        env:
          BC_REPO_URL: ${{ vars.BC_REPO_URL }}
          BC_REF: ${{ inputs.ref || vars.BC_REF }}
        run: |
          if [ -z "$BC_REPO_URL" ]; then
            echo "::error::請設定儲存庫變數 BC_REPO_URL（Settings → Secrets and variables → Actions → Variables）"
            exit 1
          fi
          branch=""
          if [ -n "$BC_REF" ]; then branch="--branch $BC_REF"; fi
          # 優先部分複製（只下載 Scripts/Screens）；上游不支援時退回一般淺層複製
          git clone --depth 1 $branch --filter=blob:none --sparse "$BC_REPO_URL" /tmp/bc \
            || { rm -rf /tmp/bc; git clone --depth 1 $branch "$BC_REPO_URL" /tmp/bc; }
          git -C /tmp/bc sparse-checkout set Scripts Screens
          echo "BC revision: $(git -C /tmp/bc describe --tags --always)"
      - name: Check hook targets
        id: check
        shell: bash
        run: |
          set +e
          node scripts/check-bc-compat.mjs /tmp/bc 2>&1 | tee /tmp/bc-compat.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 = 全部存在、1 = 有缺失（交給下一步通知）；2 以上 = 檢查本身壞了，才讓 job 失敗
          if [ "$code" -gt 1 ]; then exit "$code"; fi
      - name: Sync the tracking issue (update on change, close when resolved)
        if: steps.check.outputs.code == '0' || steps.check.outputs.code == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/bc-compat-issue.mjs /tmp/bc-compat.log "${{ steps.check.outputs.code }}" "$(git -C /tmp/bc describe --tags --always)"
