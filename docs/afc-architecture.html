<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFC 架構導覽</title>
<meta name="color-scheme" content="light dark">
<style>
:root{
  --bg:#f7f5fb;--surface:#fff;--surface-2:#f1edf8;--line:#e3dcef;--text:#1d1830;--muted:#6b6381;
  --brand:#c2417d;--brand-2:#7c5cff;--ring:rgba(124,92,255,.35);--shadow:0 1px 2px rgba(40,20,80,.06),0 8px 24px rgba(40,20,80,.06);
  --core:#7c5cff;--hooks:#0ea5b7;--relations:#e0558f;--net:#d98a12;--heartlock:#d6455d;--i18n:#2f9e6b;--ui:#4f7cf0;--compat:#8a7f9c;
  --code-bg:#f1edf8;--code-fg:#4a2f8f;
}
:root[data-theme="dark"]{
  --bg:#0d0a14;--surface:#171221;--surface-2:#1f1830;--line:#2f2642;--text:#f3eefa;--muted:#a89fbd;
  --brand:#f06aa5;--brand-2:#a58bff;--ring:rgba(165,139,255,.4);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --core:#a58bff;--hooks:#52d0dd;--relations:#f58bb8;--net:#f0b44c;--heartlock:#ff7a8d;--i18n:#5ed49b;--ui:#7da2ff;--compat:#b3a8c6;
  --code-bg:#251c38;--code-fg:#dccbff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0a14;--surface:#171221;--surface-2:#1f1830;--line:#2f2642;--text:#f3eefa;--muted:#a89fbd;
    --brand:#f06aa5;--brand-2:#a58bff;--ring:rgba(165,139,255,.4);--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
    --core:#a58bff;--hooks:#52d0dd;--relations:#f58bb8;--net:#f0b44c;--heartlock:#ff7a8d;--i18n:#5ed49b;--ui:#7da2ff;--compat:#b3a8c6;
    --code-bg:#251c38;--code-fg:#dccbff;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(800px 380px at 85% -5%,color-mix(in srgb,var(--brand-2) 18%,transparent),transparent 70%),radial-gradient(600px 300px at 5% 0,color-mix(in srgb,var(--brand) 14%,transparent),transparent 70%)}
a{color:var(--brand-2)}
code,.path{font-family:ui-monospace,"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px clamp(16px,4vw,40px);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-style:normal;font-size:16px}
.search{position:relative;flex:1;max-width:520px;margin-left:auto}
.search input{width:100%;height:40px;padding:0 44px 0 40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;outline:none;transition:box-shadow .15s,border-color .15s}
.search input:focus{border-color:var(--brand-2);box-shadow:0 0 0 4px var(--ring)}
.search svg{position:absolute;left:13px;top:11px;width:18px;height:18px;color:var(--muted)}
.search kbd{position:absolute;right:10px;top:9px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font:12px/20px ui-monospace,monospace}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;transition:transform .15s,border-color .15s}
.icon-btn:hover{border-color:var(--brand-2);transform:translateY(-1px)}
.icon-btn:focus-visible,.chip:focus-visible,.side a:focus-visible,.path:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}

.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:36px;max-width:1360px;margin:0 auto;padding:28px clamp(16px,4vw,40px) 60px}
.side{position:sticky;top:84px;align-self:start;display:grid;gap:2px;font-size:14px}
.side small{margin:0 0 8px 12px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.side a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;color:var(--muted);text-decoration:none;transition:background .15s,color .15s}
.side a span{width:8px;height:8px;border-radius:50%;background:var(--c,var(--brand-2));opacity:.55}
.side a:hover{background:var(--surface-2);color:var(--text)}
.side a.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.side a.active span{opacity:1;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.side a.off{display:none}

.hero{padding:10px 0 26px}
.hero h1{margin:0 0 10px;font-size:clamp(30px,4.4vw,48px);line-height:1.12;letter-spacing:-.01em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:720px;margin:0;color:var(--muted);font-size:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:22px}
.stat{padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;line-height:1.1;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:13px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:13px;cursor:pointer;transition:all .15s}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--brand-2))}
.chip:hover{color:var(--text);border-color:var(--c,var(--brand-2))}
.chip[aria-pressed="true"]{color:#fff;background:var(--c,var(--brand-2));border-color:transparent}
.chip[aria-pressed="true"] i{background:#fff}

.sec{margin-bottom:44px}
.sec.hide{display:none}
.sec h2{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:22px;letter-spacing:-.01em}
.sec h2 .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.lead{margin:0 0 18px;color:var(--muted);max-width:760px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px 16px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .18s,border-color .18s}
.card::before{content:"";position:absolute;left:16px;right:16px;top:0;height:3px;border-radius:0 0 4px 4px;background:var(--c)}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.card h3{margin:4px 0 0;font-size:15.5px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card.hide{display:none}
.paths{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
.path{border:0;padding:3px 8px;border-radius:7px;background:var(--code-bg);color:var(--code-fg);font-size:12px;cursor:copy;overflow-wrap:anywhere;text-align:left;transition:filter .15s}
.path:hover{filter:brightness(1.12)}
.note{margin:16px 0 0;padding:13px 16px;border-radius:12px;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--surface);color:var(--muted);font-size:14px}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;counter-reset:s}
.step{position:relative;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:28px;height:28px;margin-bottom:10px;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--brand-2));color:#fff;font-weight:700;font-size:13px}
.step:not(:last-child)::after{content:"";position:absolute;top:30px;left:calc(100% + 2px);width:10px;height:2px;background:var(--line)}
.step h3{margin:0 0 4px;font-size:15px}
.step p{margin:0 0 8px;color:var(--muted);font-size:13.5px}
.step.hide{display:none}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
tr:last-child td{border-bottom:0}
tr.hide{display:none}
td.hl{font-weight:700;color:var(--brand);white-space:nowrap}

.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.folder{border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.folder.hide{display:none}
.folder h3{margin:0;padding:11px 15px;font:600 13.5px ui-monospace,monospace;background:color-mix(in srgb,var(--c) 14%,var(--surface-2));color:var(--text)}
.folder ul{margin:0;padding:10px 15px 13px;list-style:none;display:grid;gap:5px;color:var(--muted);font-size:13.5px}
.folder li b{color:var(--text);font-weight:600}

.empty{display:none;padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.empty.show{display:block}
footer{padding:26px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);padding:9px 16px;border-radius:999px;background:var(--text);color:var(--bg);font-size:13px;opacity:0;pointer-events:none;transition:all .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .shell{display:block}
  .side{position:sticky;top:65px;z-index:10;display:flex;overflow-x:auto;gap:6px;margin:0 -16px 20px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .side small{display:none}
  .side a{white-space:nowrap;border:1px solid var(--line);background:var(--surface)}
  .step::after{display:none}
  .brand b{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i>🌸</i><b>AFC 架構導覽</b></div>
  <label class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜尋模組、功能、檔案或通道…" autocomplete="off" aria-label="搜尋">
    <kbd>/</kbd>
  </label>
  <button class="icon-btn" id="theme" type="button" aria-label="切換深淺色" title="切換深淺色">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<div class="shell">
  <nav class="side" id="side" aria-label="章節"><small>章節</small></nav>
  <main>
    <section class="hero">
      <h1>Abundantia Florum<br><em>─Chromatica─</em></h1>
      <p>多名戀人、關係進展與內建心形鎖的 Bondage Club 插件。這裡是目前的模組邊界、Hook／通道入口、資料保存與 Heart Lock 流程；點擊任何檔案路徑即可複製。</p>
      <div class="stats" id="stats"></div>
    </section>
    <div class="chips" id="chips" role="group" aria-label="依領域篩選"></div>
    <div id="content"></div>
    <div class="empty" id="empty">找不到符合的項目，試試其他關鍵字或清除篩選。</div>
  </main>
</div>
<footer>AFC Architecture · 內容資料位於本檔 script 開頭的 SECTIONS，詳細說明見 <a href="architecture.md">architecture.md</a></footer>
<div class="toast" id="toast" role="status"></div>

<script>
/* ───────── 內容資料（改文字只需編輯這裡）───────── */
const DOMAINS = {
  core:      { label: '核心',   c: 'var(--core)' },
  hooks:     { label: 'Hook',   c: 'var(--hooks)' },
  relations: { label: '關係',   c: 'var(--relations)' },
  net:       { label: '通訊',   c: 'var(--net)' },
  heartlock: { label: '心形鎖', c: 'var(--heartlock)' },
  i18n:      { label: '翻譯',   c: 'var(--i18n)' },
  ui:        { label: '介面',   c: 'var(--ui)' },
  compat:    { label: '相容',   c: 'var(--compat)' },
};

const STATS = [
  ['20', '戀人上限'],
  ['3', '階段：交往／訂婚／結婚'],
  ['5', '通訊通道'],
  ['5', '心鎖分頁'],
  ['7', '語系'],
];

const SECTIONS = [
  { id: 'flow', title: '執行流程', d: 'core', kind: 'steps',
    lead: '入口只負責啟動；核心完成登入與設定初始化後建立 Hook，再啟動 Heart Lock。',
    items: [
      { t: 'Bundle 入口', p: '建立 window.Liko.AFC 與重複載入守衛，再動態載入 app.js。', f: ['src/main.js', 'src/app.js'] },
      { t: '核心初始化', p: '兩階段：載入期（SDK）與登入後（設定資料、帳號驗證）。', f: ['core/core-init.js'] },
      { t: '統一 Hooks', p: '安裝 AFC 與通道入口，全部登記到 registry 以便整批釋放。', f: ['hooks/index.js', 'hooks/registry.js'] },
      { t: 'Heart Lock', p: '以獨立 registry scope 啟動，可功能級回滾。', f: ['features/heartlock/init.js'] },
    ] },

  { id: 'hooks', title: 'Hook 與通道派送', d: 'hooks', kind: 'cards',
    lead: '所有 bcModSdk Hook 集中在 src/hooks/。同一個遊戲函式只掛一次，再由內部處理器派送。',
    items: [
      { t: '中央安裝入口', p: 'AFC 畫面、訊息與離線處理的 Hook 安裝點。', f: ['hooks/index.js'] },
      { t: '生命週期 registry', p: '統一登記 hook、interval、timeout；scope 支援整批釋放。', f: ['hooks/registry.js', 'hooks/lifecycle.js'] },
      { t: 'ChatRoomMessage', p: '唯一的訊息 Hook，依序處理 L10N、Heart Lock、AFC Beep 與診斷訂閱。', f: ['hooks/chat-message-channel.js'] },
      { t: 'ServerSocket', p: '每個 event 只註冊一個底層 dispatcher，內部可有多個訂閱者。', f: ['core/socket.js'] },
      { t: '房間同步與關係顯示', p: '房內角色資料載入後對帳；關係標籤與圖示繪製。', f: ['hooks/room-sync.js', 'hooks/relationship-visual.js'] },
      { t: 'Heart Lock Hooks', p: '鎖具、圖示、移除保護、Craft 與高潮事件。', f: ['hooks/heartlock/index.js', 'hooks/heartlock/removal.js', 'hooks/heartlock/crafting.js', 'hooks/heartlock/orgasm.js'] },
    ],
    table: { head: ['優先序', '誰', 'InformationSheet 行為'],
      rows: [
        ['10', 'BCX', '接管資料頁；子頁開啟時不呼叫 next，底下全被跳過'],
        ['7', 'AFC', '繪製戀人面板與 Profile 模態（面板內遮 hover、吃點擊）'],
        ['8（建議）', 'overlay 插件，如 FCM', '繪製在 AFC 之上，並在 AFC 模態之前處理點擊'],
        ['5', '一般繪製', '一般插件'],
      ], hlCol: 0,
      note: 'bcModSdk 規則：數字大者先跑、屬外層；不呼叫 next() 會短路整條鏈。' } },

  { id: 'relations', title: '關係系統', d: 'relations', kind: 'steps',
    lead: '資料正規化與寫入集中在 service；申請、升格、恢復共用同一套 request manager。',
    items: [
      { t: '輸入驗證', p: 'MemberNumber、日期與清單正規化。', f: ['features/relationships/lover-model.js'] },
      { t: '唯一寫入入口', p: '新增、更新、移除、替換戀人；上限 20 人，等待中的申請預留名額。', f: ['features/relationships/lovers.js'] },
      { t: '互動流程', p: '申請（3 分鐘有效、60 秒冷卻）、升格（每階段滿 7 天）、恢復、解除。', f: ['propose.js', 'stage.js', 'restore.js', 'breakup.js'] },
    ],
    extra: [
      { t: '請求生命週期', p: '送出、收到、倒數、接受、拒絕與過期清理。', f: ['features/relationships/request-manager.js'] },
      { t: '房內對帳', p: '房間角色資料載入後補齊不對稱關係。', f: ['features/relationships/reconcile.js'] },
      { t: '備份復原', p: '舊備份只當唯讀來源，復原只補缺少的戀人，不清空清單。', f: ['core/lover-backup.js', 'features/relationships/backup-restore.js'] },
      { t: '解除規則', p: '對話選單與 /afc-breakup 隨時可解除；設定頁名單需超過 7 天沒見面。', f: ['ui/settings-page.js', 'features/relationships/breakup.js'] },
    ] },

  { id: 'data', title: '資料與持久化', d: 'core', kind: 'cards',
    lead: 'ExtensionSettings 是主資料；OnlineSharedSettings 只發布副本，不反向覆蓋。Runtime 狀態不是第二份持久資料。',
    items: [
      { t: 'AFC_Data', p: '本人戀人與共享偏好的唯一主資料，含 memberNumber 帳號識別；其他帳號或損壞資料絕不覆寫。', f: ['ExtensionSettings.AFC_Data'] },
      { t: 'AFC', p: '私人偏好設定。', f: ['ExtensionSettings.AFC'] },
      { t: 'AFC_HeartLock', p: 'padlocks、craftLocks、declinedRecovery、recoveryDecisions、removedLocks；快照為 version 2 / runtime 完整 JSON。', f: ['ExtensionSettings.AFC_HeartLock'] },
      { t: '公開副本', p: '戀人清單、鎖權限、鎖摘要（owner／assetName／lockId）。筆記與快照不公開。', f: ['OnlineSharedSettings.AFC', 'OnlineSharedSettings.AFC_HeartLock'] },
      { t: 'relationRuntime', p: 'requests（lover／stage／restore）、privateRooms、recentBeeps、proposalCooldowns、pendingAcks。', f: ['core/state.js'] },
      { t: 'Heart Lock state', p: 'lifecycle、timers、vibe、operations、panel 分組。', f: ['features/heartlock/state.js'] },
    ],
    note: '清除關係只由明確解除或確認出廠重置執行，不因離線或同步缺漏刪除。完整規則見 Storage.md。' },

  { id: 'net', title: '網路與通道', d: 'net', kind: 'cards',
    lead: 'AFC 不控制 BC 連線，只在既有事件上同步關係、房名與 Heart Lock 資料。',
    items: [
      { t: 'AFC::Beep', p: '同房關係操作（Hidden、頂層 Target 1 對 1）。身分只信伺服器 Sender；關鍵訊息重送到 ACK，接收端冪等去重。', f: ['net/hidden-beep.js', 'net/beep.js', 'net/beep-router.js'] },

      { t: 'AccountBeep', p: '跨房分享私人房名（afcBeep），只送得到好友；戀人恆為好友。', f: ['net/roomname.js', 'net/online.js'] },

      { t: 'BC 相容', p: '檢查被 hook 的 BC 函式是否仍存在（不檢查簽名）。', f: ['npm run check:bc -- <BC 原始碼>'] },

/* ───────── 渲染 ───────── */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const content = $('#content'), side = $('#side'), chips = $('#chips'), q = $('#q'), empty = $('#empty');
const state = { query: '', domain: null };

function paths(list) {
  const box = el('div', 'paths');
  for (const f of list) {
    const b = el('button', 'path', f); b.type = 'button'; b.title = '點擊複製';
    b.addEventListener('click', () => copy(f));
    box.append(b);
  }
  return box;
}
function card(it, d, cls) {
  const c = el('article', cls); c.style.setProperty('--c', DOMAINS[d].c);
  c.append(el('h3', null, it.t), el('p', null, it.p), paths(it.f));
  return c;
}
function folder(it, d) {
  const c = el('article', 'folder'); c.style.setProperty('--c', DOMAINS[d].c);
  const ul = el('ul');
  for (const [a, b] of it.li) {
    const li = el('li');
    if (b) li.append(el('b', null, a), document.createTextNode(' ' + b)); else li.textContent = a;
    ul.append(li);
  }
  c.append(el('h3', null, it.t), ul);
  return c;
}
function table(t) {
  const wrap = el('div', 'tablewrap'), tb = el('table'), thead = el('thead'), tr = el('tr');
  for (const h of t.head) tr.append(el('th', null, h));
  thead.append(tr); tb.append(thead);
  const body = el('tbody');
  for (const r of t.rows) {
    const row = el('tr');
    r.forEach((v, i) => row.append(el('td', i === t.hlCol ? 'hl' : null, v)));
    body.append(row);
  }
  tb.append(body); wrap.append(tb);
  return wrap;
}

for (const s of SECTIONS) {
  const sec = el('section', 'sec'); sec.id = s.id; sec.dataset.domain = s.d; sec.dataset.domain2 = s.dd || '';
  sec.style.setProperty('--c', DOMAINS[s.d].c);
  const h = el('h2'); h.append(el('span', 'dot'), document.createTextNode(s.title));
  sec.append(h, el('p', 'lead', s.lead));
  const gridClass = s.kind === 'steps' ? 'steps' : s.kind === 'folders' ? 'folders' : 'grid';
  const grid = el('div', gridClass);
  for (const it of s.items) {
    grid.append(s.kind === 'steps' ? card(it, s.d, 'step') : s.kind === 'folders' ? folder(it, s.dd || s.d) : card(it, s.d, 'card'));
  }
  sec.append(grid);
  if (s.extra) {
    const g2 = el('div', 'grid'); g2.style.marginTop = '14px';
    for (const it of s.extra) g2.append(card(it, s.d, 'card'));
    sec.append(g2);
  }
  if (s.table) {
    const w = table(s.table); w.style.marginTop = '14px'; sec.append(w);
    if (s.table.note) sec.append(el('p', 'note', s.table.note));
  }
  if (s.note) sec.append(el('p', 'note', s.note));
  content.append(sec);

  const a = el('a'); a.href = '#' + s.id; a.dataset.target = s.id; a.style.setProperty('--c', DOMAINS[s.d].c);
  a.append(el('span'), document.createTextNode(s.title)); side.append(a);
}

for (const [n, l] of STATS) { const d = el('div', 'stat'); d.append(el('b', null, n), el('span', null, l)); $('#stats').append(d); }

for (const [k, v] of Object.entries(DOMAINS)) {
  if (!SECTIONS.some(s => s.d === k || s.dd === k)) continue;
  const b = el('button', 'chip'); b.type = 'button'; b.setAttribute('aria-pressed', 'false'); b.style.setProperty('--c', v.c);
  b.append(el('i'), document.createTextNode(v.label));
  b.addEventListener('click', () => {
    state.domain = state.domain === k ? null : k;
    chips.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b && state.domain === k)));
    apply();
  });
  chips.append(b);
}

/* ───────── 搜尋與篩選 ───────── */
function apply() {
  const qs = state.query.trim().toLowerCase();
  let anyVisible = false;
  document.querySelectorAll('.sec').forEach(sec => {
    const domainOk = !state.domain || sec.dataset.domain === state.domain || sec.dataset.domain2 === state.domain;
    const title = sec.querySelector('h2').textContent.toLowerCase();
    let hits = 0;
    sec.querySelectorAll('.card,.step,.folder,tbody tr').forEach(u => {
      const ok = !qs || title.includes(qs) || u.textContent.toLowerCase().includes(qs);
      u.classList.toggle('hide', !ok);
      if (ok) hits++;
    });
    const show = domainOk && hits > 0;
    sec.classList.toggle('hide', !show);
    side.querySelector('[data-target="' + sec.id + '"]').classList.toggle('off', !show);
    if (show) anyVisible = true;
  });
  empty.classList.toggle('show', !anyVisible);
}
q.addEventListener('input', () => { state.query = q.value; apply(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q && !e.metaKey && !e.ctrlKey) { e.preventDefault(); q.focus(); }
  else if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; state.query = ''; apply(); q.blur(); }
});

/* ───────── scrollspy ───────── */
const links = [...side.querySelectorAll('a')];
const io = new IntersectionObserver(es => {
  const v = es.filter(e => e.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
  if (v) links.forEach(l => l.classList.toggle('active', l.dataset.target === v.target.id));
}, { rootMargin: '-15% 0px -65%', threshold: [0, .2, .5] });
document.querySelectorAll('.sec').forEach(s => io.observe(s));

/* ───────── 複製與主題 ───────── */
const toast = $('#toast'); let toastTimer;
function showToast(msg) {
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); showToast('已複製：' + text); }
  catch { showToast('無法存取剪貼簿'); }
}
const root = document.documentElement;
try { const saved = localStorage.getItem('afc-doc-theme'); if (saved) root.dataset.theme = saved; } catch { /* storage 不可用時沿用系統設定 */ }
$('#theme').addEventListener('click', () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('afc-doc-theme', root.dataset.theme); } catch { /* 忽略 */ }
});
</script>
